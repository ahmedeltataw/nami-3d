<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact sheet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #10191b; color: #e9f1ef; font: 16px/1.4 system-ui, sans-serif; }
    body { padding: 32px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 26px; font-weight: 650; }
    .date { color: #a8b9b6; }
    .direction { margin: 0 0 28px; }
    h2 { margin: 0 0 12px; color: #b8d4cc; font-size: 18px; font-weight: 600; text-transform: capitalize; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    figure { min-width: 0; margin: 0; }
    .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #324345; background: #182426; }
    img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
    .missing { width: 100%; height: 100%; display: grid; place-items: center; color: #758a86; font-size: 14px; letter-spacing: .04em; }
    figcaption { min-height: 28px; padding-top: 6px; color: #c2d0cd; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header><h1 id="heading"></h1><div class="date" id="date"></div></header>
  <main id="sections"></main>
</body>
</html>
